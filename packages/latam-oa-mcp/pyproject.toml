[project]
name = "latam-oa-mcp"
version = "0.2.0"
description = "MCP server for Latin American Diamond open access sources: SciELO, LA Referencia, Oasisbr and DOAJ"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pymupdf>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.4.4"]

[project.scripts]
latam-oa-mcp = "latam_oa_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latam_oa_mcp"]
